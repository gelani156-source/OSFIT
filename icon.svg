OSFIT — нативный WidgetKit, исходные файлы (iOS 17+)

Это НЕ готовый IPA и НЕ автоматически устанавливаемый PWA-виджет.
Нужны Xcode на Mac, iOS App target, Widget Extension target и Apple App Group.

1) Создайте iOS App + Widget Extension в Xcode (iOS 17+).
2) Добавьте SharedWorkout.swift в оба target, OSFitWidget.swift — в Widget Extension.
3) Настройте App Groups у обоих target, замените group.example.osfit на свой ID.
4) Хост-приложение должно вызывать OSFitStore.save(...) для передачи упражнения в виджет.
5) Для синхронизации именно с веб-OSFIT необходимо отдельно реализовать защищённый мост данных между веб-IndexedDB и хост-приложением. Сейчас его нет.
6) Кнопки в нативном виджете меняют только App Group-хранилище. Они не изменяют веб-IndexedDB.

В комплект также входит полностью рабочая логика мини-виджета ВНУТРИ OSFIT PWA.
Это основной результат, который можно обновить через GitHub с телефона.
